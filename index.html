<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informatii Pro4kings</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
        }

        /* Sectiunea Welcome (Ecran complet) */
        .welcome-section {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
        }

        .welcome-section h1 {
            font-size: 2.8rem;
            color: #38bdf8;
            text-shadow: 0 4px 10px rgba(56, 189, 248, 0.3);
        }

        /* Sectiunea de Scroll (Imagine + Descriere) */
        .info-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px;
        }

        .info-section img {
            max-width: 90%;
            width: 650px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            border: 2px solid #334155;
        }

        .info-section p {
            max-width: 750px;
            font-size: 1.25rem;
            line-height: 1.7;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <!-- Ecranul 1: Welcome -->
    <section class="welcome-section">
        <h1>Bine ai venit pe website-ul Informatii Pro4kings</h1>
    </section>

    <!-- Ecranul 2: Scroll jos pentru Imagine si Descriere -->
    <section class="info-section">
        <!-- Inlocuieste "poza-ta.jpg" cu numele pozei tale -->
        <img src="poza-ta.jpg" alt="Imagine Pro4kings">

        <!-- Inlocuieste textul de mai jos cu descrierea ta -->
        <p>Aici pui descrierea ta. Poți scrie toate informațiile și detaliile pe care dorești să le afișezi despre Pro4kings.</p>
    </section>

</body>
</html>
